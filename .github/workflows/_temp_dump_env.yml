name: _Temp Dump Env
on:
  workflow_dispatch:
jobs:
  dump:
    runs-on: ubuntu-latest
    environment: github-pages
    env:
      BASE_URL: ${{ secrets.BASE_URL }}
      PUBLIC_SITE_NAME: ${{ secrets.PUBLIC_SITE_NAME }}
      SITE_URL: ${{ secrets.SITE_URL }}
    steps:
      - name: "dump secrets and vars"
        run: |
          python3 -c "import os; v=os.environ.get('BASE_URL',''); print('BYTES_BASE_URL=' + ','.join(str(b) for b in v.encode()))"
          python3 -c "import os; v=os.environ.get('PUBLIC_SITE_NAME',''); print('BYTES_PUBLIC_SITE_NAME=' + ','.join(str(b) for b in v.encode()))"
          python3 -c "import os; v=os.environ.get('SITE_URL',''); print('BYTES_SITE_URL=' + ','.join(str(b) for b in v.encode()))"
